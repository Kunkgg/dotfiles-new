# herdr 配置 —— 本 repo 的配置资源（config artifact）。
# wayfinder #5 落地：键位草案定稿于 #3，直连键安全性核查见 #2，
# 鼠标 / 剪贴板 / 视觉归属见 #4；术语见 CONTEXT.md。
#
# 【硬前提】wezterm.lua 里不得再设 config.leader —— LEADER 激活时会吞掉 ctrl+a，
# 不删则下面的 prefix 永远收不到（#2 结论）。
#
# 运行时状态（session.json / *.sock / *.log）留在 ~/.config/herdr/，不进 repo；
# 本文件经文件级软链挂到 ~/.config/herdr/config.toml。

onboarding = false

[theme]
# 单真源 = wezterm 的调色板：herdr 用 OSC 4/10/11 向宿主查询并镜像 ANSI 调色板。
# 观感不满意时的回退：一行切回内建 "catppuccin"。
name = "terminal"
auto_switch = false

[theme.custom]
# #7：terminal 主题下 selection_bg 被解析为 Reset（= 终端背景色），预览选中项因此不可见。
# 这是对 #4「单真源 = wezterm 调色板」的定向例外 —— 取值 #313244 即 Catppuccin Mocha
# surface0，与 wezterm 侧 color_scheme 同源；OSC 镜像机制给不出可用的选中底色，
# 该 token 是镜像路径覆盖不到的盲点。
selection_bg = "#313244"

[ui]
# 显式写出出厂默认，防止上游改默认后静默推翻 #4 的决定。
mouse_capture   = true   # 鼠标归 herdr；wezterm 原生选取走 Shift+拖拽
copy_on_select  = true   # 拖选即进系统剪贴板（macOS 本地走 pbcopy）
pane_scrollbars = true

[keys]
prefix = "ctrl+a"

# ── A. 前缀层：动作字母对齐旧 wezterm LEADER；同行挂 ctrl+alt 直连 ──
split_vertical   = ["prefix+v", "ctrl+alt+v"]        # 旧 LEADER+v
split_horizontal = ["prefix+c", "ctrl+alt+c"]        # 旧 LEADER+c
focus_pane_left  = ["prefix+h", "ctrl+alt+h"]        # 旧 LEADER+hjkl
focus_pane_down  = ["prefix+j", "ctrl+alt+j"]
focus_pane_up    = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
new_tab          = ["prefix+n", "ctrl+alt+n"]        # 旧 LEADER+n
close_pane       = ["prefix+x", "ctrl+alt+x"]        # 旧 LEADER+x
zoom             = ["prefix+f", "ctrl+alt+f"]        # 旧 LEADER+f
switch_tab       = ["prefix+1..9", "ctrl+alt+1..9"]  # 旧 LEADER+1..9
workspace_picker = "prefix+w"                        # 旧 LEADER+w
rename_tab       = "prefix+r"                        # 旧 LEADER+r

# ── B. 撞车 1：new_tab 占了出厂 next_tab 的 prefix+n，next/previous 让位到 tab 键族；
#       同时显式清空出厂 cycle_pane_*（hjkl 已覆盖 pane 跳转，cycle 冗余）。
next_tab            = "prefix+tab"
previous_tab        = "prefix+shift+tab"
cycle_pane_next     = ""
cycle_pane_previous = ""

# ── C. 撞车 2：rename_tab 占了出厂 resize_mode 的 prefix+r（rename 更常用），
#       herdr 独有的 resize_mode 让位。
resize_mode = "prefix+m"

# ── D. 出厂默认原样保留，显式写出以便审阅 ──
copy_mode     = "prefix+["
close_tab     = "prefix+shift+x"
new_workspace = "prefix+shift+n"

# ── E. 工作区导航模式（prefix+w）的 workspace 轴：保持出厂，不新增绑定 ──
# #7 定案（源码级核实，v0.9.0）：navigate_workspace_up/down 的语义是移动
# 「预览选中项」（CONTEXT.md），不发任何切换事件；Enter 才提交为 WorkspaceFocus，
# Esc 或前缀键取消、不切换。故出厂 ↑/↓ 语义本就正确 —— #5 观测到的「无
# workspace.focus 事件」符合设计，不是 bug。
# 本机原先「只闪光标、不位移」是可见性问题：terminal 主题下 selection_bg = Reset，
# 画了等于没画；已由上面的 [theme.custom] 定向例外修掉。
# 切 workspace 取既有两条：prefix+g（会话导航器）与 prefix+w → ↑/↓ → Enter。
# 因此 [keys] 保持不写 navigate_*、不加 switch_workspace、不加 previous/next_workspace。
